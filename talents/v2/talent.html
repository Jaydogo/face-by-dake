<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TALENTS BY DAKĒ © — Talent</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1412">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../talents.css">
</head>
<body class="v2">
<header class="header">
  <a class="logo" href="./">TALENTS BY DAKĒ<span class="c">©</span></a>
  <nav class="nav caps" aria-label="Sections"><a href="./">Board</a><a href="../../">Face studio</a></nav>
  <div class="header-cta caps" id="pager"></div>
</header>

<main class="v2-talent" id="app"></main>

<script src="../talents-data.js"></script>
<script src="../data.js"></script>
<script src="../ui.js"></script>
<script>
const P = '../';
const t = TU.get(new URLSearchParams(location.search).get('t'));
const i = TALENTS.indexOf(t), n = TALENTS.length;
const prev = TALENTS[(i - 1 + n) % n], next = TALENTS[(i + 1) % n];
const f = t.fiche, s = t.social;
document.title = `${t.first} ${t.last} — TALENTS BY DAKĒ ©`;
const mail = `mailto:booking@dake.studio?subject=${encodeURIComponent('Booking ' + t.first + ' ' + t.last)}`;
document.getElementById('pager').innerHTML = `<a href="talent.html?t=${prev.slug}" aria-label="Talent précédent">←</a><span class="mono">${String(i + 1).padStart(2, '0')} / ${String(n).padStart(2, '0')}</span><a href="talent.html?t=${next.slug}" aria-label="Talent suivant">→</a>`;

const blocks = [['polas', 'Polas'], ['book', 'Book'], ['video', 'Vidéo']];
if (s) blocks.push(['stats', 'Stats']);

document.getElementById('app').innerHTML = `
  <aside class="v2-side">
    <a class="back caps" href="./">← Board</a>
    <figure class="media face"><img src="${TU.src(t.cover)}" alt="Portrait de ${esc(t.first)} ${esc(t.last)}"></figure>
    <div>
      <p class="caps dim" style="margin-bottom:10px">${t.code} · ${TU.cats(t)}</p>
      <h1>${esc(t.first)}<br><em>${esc(t.last)}</em></h1>
    </div>
    <dl class="fiche">
      <dt>Taille</dt><dd class="num">${f.taille} cm</dd>
      <dt>Mensurations</dt><dd class="num">${f.poitrine}-${f.tailleT}-${f.hanches}</dd>
      <dt>Pointure</dt><dd class="num">${f.pointure} EU</dd>
      <dt>Yeux / Cheveux</dt><dd>${esc(f.yeux)} / ${esc(f.cheveux)}</dd>
      <dt>Ville</dt><dd>${esc(t.city)}</dd>
      ${s ? `<dt>Instagram</dt><dd class="num">${TU.k(s.ig.followers)} · ${TU.pct(s.ig.er)}</dd><dt>TikTok</dt><dd class="num">${TU.k(s.tt.followers)} · ${TU.pct(s.tt.er)}</dd>` : ''}
    </dl>
    <nav class="toc caps" aria-label="Sur cette fiche">${blocks.map((b, k) => `<a href="#${b[0]}"><span>${b[1]}</span><span class="mono">0${k + 1}</span></a>`).join('')}</nav>
    <div class="actions">
      <a class="btn btn--light" href="${mail}">Demander une option</a>
      <a class="btn btn--ghost" href="#">Carte composite (PDF)</a>
    </div>
  </aside>

  <div class="v2-main">
    <section class="v2-sec" id="polas">
      <div class="v2-sec-head"><h2>Polas</h2><span class="caps dim">Digitals · sans retouche</span></div>
      <div class="contact reveal">
        <div class="contact-edge" style="grid-column:1 / -1"><span>DAKĒ FACE ▸ ${t.code.toUpperCase()}</span><span>KODAK 400TX</span><span>${t.polas.length} VUES</span></div>
        ${t.polas.map((p, k) => `<figure><div class="media"><img src="${TU.src(p[0])}" alt="Pola ${p[1]}" loading="lazy"></div><figcaption><span>${k + 1}A ▸</span><span>${p[1].toUpperCase()}</span></figcaption></figure>`).join('')}
      </div>
    </section>

    <section class="v2-sec" id="book">
      <div class="v2-sec-head"><h2>Book</h2><div class="strip-nav"><button type="button" data-d="-1" aria-label="Précédent">←</button><button type="button" data-d="1" aria-label="Suivant">→</button></div></div>
      <div class="strip" id="strip">${t.book.map(b => `<figure class="media"><img src="${TU.src(b)}" alt="" loading="lazy"></figure>`).join('')}</div>
      <p class="caps dim" style="margin-top:14px">${t.book.length} images · Glisser pour parcourir</p>
    </section>

    <section class="v2-sec" id="video">
      <div class="v2-sec-head"><h2>Vidéo</h2><span class="caps dim">${t.video.len}</span></div>
      <div class="player reveal">
        <video src="${TU.src(t.video.src)}" poster="${TU.src(t.video.poster)}" playsinline preload="none"></video>
        <button class="play caps" type="button"><span><svg class="play-ic" viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0L10 6L0 12Z"/></svg>Lire</span></button>
      </div>
      <div class="player-meta caps"><span>${esc(t.video.title)}</span><span class="dim">Réalisée par Daké</span></div>
    </section>

    ${s ? `<section class="v2-sec is-light" id="stats">
      <div class="v2-sec-head"><h2>Stats <em>&amp; engagement</em></h2><span class="caps dim">IG · TikTok</span></div>
      ${renderStats(s)}
    </section>` : ''}

    <a class="v2-sec" href="talent.html?t=${next.slug}" style="display:block;border-bottom:0">
      <span class="caps dim">Suivant · ${next.code}</span>
      <p class="serif" style="font-size:var(--fs-h2);line-height:.92;margin-top:12px">${esc(next.first)} <em>${esc(next.last)}</em> →</p>
    </a>
  </div>`;

// Book : flèches + glisser à la souris
const strip = document.getElementById('strip');
document.querySelectorAll('.strip-nav button').forEach(b => b.addEventListener('click', () => strip.scrollBy({ left: b.dataset.d * strip.clientWidth * .6, behavior: 'smooth' })));
let down = false, sx = 0, sl = 0;
strip.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; sx = e.clientX; sl = strip.scrollLeft; strip.style.scrollSnapType = 'none'; });
addEventListener('pointerup', () => { if (down) { down = false; strip.style.scrollSnapType = ''; } });
strip.addEventListener('pointermove', e => { if (down) strip.scrollLeft = sl - (e.clientX - sx); });
strip.addEventListener('dragstart', e => e.preventDefault());

initPlayer(document);
initReveal();
initSpy(document.querySelectorAll('.toc a'));
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TALENTS BY DAKĒ © — V2 Planche</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1412">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../talents.css">
</head>
<body class="v2">
<header class="header">
  <a class="logo" href="./">TALENTS BY DAKĒ<span class="c">©</span></a>
  <nav class="nav caps" aria-label="Sections">
    <a href="./" aria-current="page">Talents</a>
    <a href="../../">Face studio</a>
    <a href="mailto:booking@dake.studio">Booking</a>
  </nav>
  <div class="header-cta"><a class="btn btn--s" href="mailto:booking@dake.studio" style="background:var(--cream);color:var(--ink);border-color:var(--cream)">Booker un talent</a></div>
</header>

<main>
  <section class="v2-hero">
    <h1>Le <em>board.</em></h1>
    <p class="count caps"><span id="count">08</span> talents<br><span class="dim">Paris · Lyon · Marseille · Bruxelles</span></p>
  </section>
  <div class="v2-bar">
    <div class="filters" role="group" aria-label="Filtrer les talents" id="filters"></div>
    <div class="view" role="group" aria-label="Taille de la grille">
      <button class="chip" type="button" data-v="grid" aria-pressed="true">Grand</button>
      <button class="chip" type="button" data-v="list" aria-pressed="false">Planche</button>
    </div>
  </div>
  <div class="v2-grid" id="grid"></div>
</main>
<footer class="foot caps dim" style="margin-top:var(--sec)"><span>© Daké 2026</span><span>Maquette V2 · Planche</span><a href="../v1/">Voir la V1 →</a></footer>

<script src="../talents-data.js"></script>
<script src="../data.js"></script>
<script src="../ui.js"></script>
<script>
const P = '../';
const grid = document.getElementById('grid');
grid.innerHTML = TALENTS.map(t => `
  <a class="v2-card" href="talent.html?t=${t.slug}" data-cats="${t.cats.join(' ')}">
    <div class="top mono"><span>${t.code}</span>${t.social ? `<span class="badge">${TU.k(TU.reach(t.social))}</span>` : ''}</div>
    <figure class="media"><img src="${TU.src(t.cover)}" alt="" loading="lazy"></figure>
    <div class="over"><span>${t.fiche.taille} cm</span><span>${t.fiche.pointure} EU</span><span>${t.fiche.poitrine}-${t.fiche.tailleT}-${t.fiche.hanches}</span><span>${esc(t.fiche.yeux)}</span></div>
    <div class="label"><span class="serif">${esc(t.first)} <em>${esc(t.last)}</em></span><span class="caps dim">${t.cats.map(c => CAT_LABEL[c].slice(0, 4) + '.').join(' ')}</span></div>
  </a>`).join('');

const cats = [['all', 'Tous'], ['mannequin', 'Mannequins'], ['comedien', 'Comédiens'], ['influence', 'Influence']];
const fBox = document.getElementById('filters');
fBox.innerHTML = cats.map(([k, l], i) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${i === 0}">${l}</button>`).join('');
fBox.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  fBox.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  let n = 0;
  grid.querySelectorAll('.v2-card').forEach(c => { const show = b.dataset.f === 'all' || c.dataset.cats.includes(b.dataset.f); c.classList.toggle('is-hidden', !show); n += show; });
  document.getElementById('count').textContent = String(n).padStart(2, '0');
});
document.querySelector('.view').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  document.querySelectorAll('.view .chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  grid.classList.toggle('is-list', b.dataset.v === 'list');
});
</script>
</body>
</html>

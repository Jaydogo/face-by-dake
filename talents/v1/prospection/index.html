<!doctype html>
<html lang="fr" class="theme-white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Créer une sélection — TALENTS BY DAKĒ ©</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<script src="../../gate.js"></script>
<link rel="stylesheet" href="../../talents.css">
<style>
  .sb{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);gap:var(--gut);padding:0 var(--gut) var(--sec);align-items:start}
  .pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gut)}
  .pick button{position:relative;text-align:left;display:grid;gap:10px}
  .pick .media{aspect-ratio:3/4;outline:1px solid transparent;outline-offset:4px;transition:outline-color .3s,opacity .3s}
  .pick button:not([aria-pressed="true"]) .media{opacity:.55}
  .pick button[aria-pressed="true"] .media{outline-color:var(--ink)}
  .pick .n{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--cream);font-family:var(--mono);font-size:.75rem;opacity:0;transform:scale(.6);transition:all .3s var(--ease)}
  .pick button[aria-pressed="true"] .n{opacity:1;transform:none}
  .pick .serif{font-size:1.5rem;line-height:1}
  .pick .serif em{font-style:italic}
  .panel{position:sticky;top:calc(var(--header) + 20px);display:grid;gap:18px;padding:24px;background:var(--paper);border:1px solid var(--line)}
  .field{display:grid;gap:6px}
  .field input,.field textarea{font:inherit;font-size:1rem;padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:0;color:var(--ink)}
  .field textarea{min-height:84px;resize:vertical}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
  .out{font-family:var(--mono);font-size:.75rem;word-break:break-all;padding:12px 14px;background:var(--soft);min-height:3em}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .pitch{white-space:pre-wrap;font-size:.875rem;line-height:1.55;padding:14px;border:1px dashed var(--line);background:#fff}
  .toast{font-family:var(--mono);font-size:.75rem;color:var(--accent);min-height:1.2em}
  @media (max-width:860px){.sb{grid-template-columns:1fr}.pick{grid-template-columns:1fr 1fr}.panel{position:static}}
</style>
</head>
<body>
<header class="header">
  <a class="logo" href="../">TALENTS BY DAKĒ<span class="c">©</span></a>
  <nav class="nav caps" aria-label="Sections"><a href="../">Talents</a><a href="./" aria-current="page">Créer une sélection</a></nav>
  <div class="header-cta caps dim">Outil interne</div>
</header>

<main>
  <section class="v1-hero">
    <div class="folio caps"><span>talents by dakē</span><span>Prospection</span><span>Interne</span></div>
    <h1><span class="br">[</span><em>Sélection</em><span class="br">]</span><sup id="count">00</sup></h1>
    <div class="v1-hero-foot"><p>Choisis les profils dans l'ordre où tu veux qu'ils apparaissent, donne un nom au prospect, et copie le lien.</p></div>
  </section>

  <div class="sb">
    <div class="pick" id="pick"></div>

    <aside class="panel" aria-label="Lien de sélection">
      <label class="field"><span class="caps dim">Prospect</span><input id="client" placeholder="Sézane" autocomplete="off"></label>
      <label class="field"><span class="caps dim">Projet</span><input id="projet" placeholder="Campagne printemps-été 2027" autocomplete="off"></label>
      <label class="field"><span class="caps dim">Mot d'intro (facultatif)</span><textarea id="note" placeholder="Quatre visages naturels, à l'aise en mouvement…"></textarea></label>
      <div class="field"><span class="caps dim">Lien</span><div class="out" id="out">Choisis au moins un profil.</div></div>
      <div class="row">
        <button class="btn btn--s" type="button" id="copy">Copier le lien</button>
        <a class="btn btn--s btn--ghost" id="open" href="#" target="_blank" rel="noopener">Ouvrir</a>
      </div>
      <div class="field"><span class="caps dim">Message de prospection</span><div class="pitch" id="pitch"></div></div>
      <div class="row"><button class="btn btn--s btn--ghost" type="button" id="copy-pitch">Copier le message</button></div>
      <p class="toast" id="toast" aria-live="polite"></p>
    </aside>
  </div>
</main>

<script src="../../talents-data.js"></script>
<script src="../../data.js"></script>
<script src="../../ui.js"></script>
<script>
const P = '../../'; window.TALENTS_PREFIX = P;
const picked = [];
const $ = id => document.getElementById(id);
const base = location.href.replace(/prospection\/.*$/, '');

$('pick').innerHTML = TALENTS.map(t => `
  <button type="button" data-id="${t.slug}" aria-pressed="false">
    <span class="n"></span>
    <span class="media"><img src="${TU.src(t.cover)}" alt="" loading="lazy"></span>
    <span class="serif">${esc(t.first)} <em>${esc(t.last)}</em></span>
    <span class="caps dim">${TU.cats(t)}${t.social ? ' · ' + TU.k(TU.reach(t.social)) : ''}</span>
  </button>`).join('');

$('pick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = picked.indexOf(b.dataset.id);
  k < 0 ? picked.push(b.dataset.id) : picked.splice(k, 1);
  update();
});
['client', 'projet', 'note'].forEach(id => $(id).addEventListener('input', update));

function link() {
  if (!picked.length) return '';
  const q = new URLSearchParams();
  q.set('ids', picked.join(','));
  if ($('client').value.trim()) q.set('pour', $('client').value.trim());
  if ($('projet').value.trim()) q.set('projet', $('projet').value.trim());
  if ($('note').value.trim()) q.set('note', $('note').value.trim());
  return base + '?' + q.toString();
}

function update() {
  $('pick').querySelectorAll('button').forEach(b => {
    const k = picked.indexOf(b.dataset.id);
    b.setAttribute('aria-pressed', k >= 0);
    b.querySelector('.n').textContent = k >= 0 ? k + 1 : '';
  });
  $('count').textContent = String(picked.length).padStart(2, '0');
  const url = link();
  $('out').textContent = url || 'Choisis au moins un profil.';
  $('open').href = url || '#';
  const client = $('client').value.trim(), projet = $('projet').value.trim();
  const n = picked.length;
  $('pitch').textContent = n ? `Bonjour,

Je suis Jay, directeur créatif de Daké (Longines, Tissot, Marie Claire). ${projet ? `En pensant à ${projet}` : 'En pensant à vos prochaines campagnes'}, j'ai réuni ${n === 1 ? 'un profil' : n + ' profils'} que nous avons photographiés au studio${client ? `, choisis pour ${client}` : ''} :

${url}

Polas, book, vidéo et audience Instagram / TikTok sur chaque fiche. Nous pouvons prendre en charge le casting et la production.

Un appel de 15 minutes cette semaine ?

Jay` : '';
}

function copy(text, msg) {
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => { $('toast').textContent = msg; setTimeout(() => $('toast').textContent = '', 2200); });
}
$('copy').addEventListener('click', () => copy(link(), 'Lien copié.'));
$('copy-pitch').addEventListener('click', () => copy($('pitch').textContent, 'Message copié.'));
update();
</script>
</body>
</html>

<!doctype html>
<html lang="fr" class="theme-white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FACE BY DAKĒ © — Talents des productions Daké, Paris</title>
<meta name="description" content="Talent roster by DAKĒ STUDIO. Des visages, des voix, des audiences, intégrés aux productions Daké.">
<meta name="robots" content="noindex, nofollow"> <!-- SEO-LANCEMENT : à retirer au lancement (voir SEO.md) -->
<link rel="icon" href="../icon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../talents.css">
<script>
document.documentElement.classList.add('js');
// Rien ne s'affiche avant les polices : pas de saut de typo (même principe que FACE)
(function(){var d=document.documentElement,done=function(){d.classList.add('fonts-ready')};
if(document.fonts&&document.fonts.load){Promise.race([Promise.all([document.fonts.load('italic 300 80px Newsreader'),document.fonts.load('300 80px Newsreader'),document.fonts.load('500 16px "Instrument Sans"')]),new Promise(function(r){setTimeout(r,1800)})]).then(done,done)}else done();})();
</script>
</head>
<body>
<main>
  <section class="v1-hero">
    <p class="caps dim v1-kicker fade-in" id="kicker" hidden></p>
    <h1><span class="rise"><span><span class="br">[</span><em id="title">Talents</em><span class="br">]</span><sup id="count">08</sup></span></span></h1>
    <div class="v1-hero-foot fade-in">
      <p id="intro"></p>
      <div class="filters" role="group" id="filters"></div>
    </div>
  </section>

  <ol class="v1-list" id="list"></ol>
  <div class="v1-cursor" id="cursor" aria-hidden="true"><img alt=""></div>

</main>
<footer id="contact"></footer>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script src="../i18n.js"></script>
<script src="../talents-data.js"></script>
<script src="../data.js"></script>
<script src="../ui.js"></script>
<script src="../premium.js"></script>
<script src="../booking.js"></script>
<script>
const P = '../';
const sel = TU.selection();
const shown = sel ? sel.talents : TALENTS;
const list = document.getElementById('list');
const pad = n => String(n).padStart(2, '0');
const arrow = ARROW;
document.getElementById('intro').textContent = T('Des visages, des voix, des audiences. Réunis par Daké pour ses productions : campagnes, contenus, films.', 'Faces, voices, audiences. Brought together by Daké for its productions: campaigns, content, films.');
document.getElementById('filters').setAttribute('aria-label', T('Filtrer les talents', 'Filter talents'));

list.innerHTML = shown.map((t, n) => `
  <li class="v1-row" data-cats="${t.cats.join(' ')}" style="--d:${n}">
    <a href="talent.html?t=${t.slug}${sel ? '&' + sel.qs : ''}" data-img="${TU.src(t.cover)}">
      <span class="code mono dim">${t.code}</span>
      <span class="thumb media"><img src="${TU.src(t.cover)}" alt="" loading="lazy"></span>
      <span class="name">${esc(t.first)} <em>${esc(t.last)}</em></span>
      <span class="cat caps">${TU.cats(t)}</span>
      <span class="city caps dim">${esc(TR(t.city))}</span>
      ${arrow}
    </a>
  </li>`).join('');

// SEO : titre, description, liste des talents pour Google
TU.seo({
  title: T('FACE BY DAKĒ © — Talents des productions Daké, Paris', 'FACE BY DAKĒ © — Talent roster of Daké productions, Paris'),
  description: T('Talent roster by DAKĒ STUDIO. Mannequins, comédiens et créateurs de contenu réunis par Daké pour ses campagnes, contenus et films produits à Paris.', 'Faces, voices, audiences. Models, actors and content creators photographed and selected by Daké in Paris. Polas, book, video and stats on every profile.'),
  ld: { '@graph': [FACE_ORG, { '@type': 'CollectionPage', name: 'Talents', url: SITE_URL + '/talents/v1/', inLanguage: EN ? 'en-GB' : 'fr-FR', about: { '@id': FACE_ORG['@id'] },
    mainEntity: { '@type': 'ItemList', itemListElement: TALENTS.map((t, i) => ({ '@type': 'ListItem', position: i + 1, url: SITE_URL + '/talents/v1/talent.html?t=' + t.slug, name: t.first + ' ' + t.last })) } }] }
});

// Mode casting : proposition de production pour un prospect, casting envisagé, CTA « Parlons du projet »
if (sel) {
  const n = pad(shown.length);
  document.title = `Casting ${sel.client || 'Daké'} — FACE BY DAKĒ ©`;
  const k = document.getElementById('kicker'); k.hidden = false; k.textContent = T('Casting imaginé par Daké pour', 'Casting imagined by Daké for');
  document.getElementById('title').textContent = sel.client || T('Vous', 'You');
  document.getElementById('count').textContent = n;
  document.getElementById('intro').textContent = TX(sel, 'note') || T(`Les visages que nous imaginons pour une production Daké${sel.project ? ' : ' + sel.project : ''}. Direction artistique, casting, prise de vue et livrables, réunis par Daké.`, `The faces we imagine for a Daké production${sel.project ? ': ' + sel.project : ''}. Art direction, casting, shoot and deliverables, brought together by Daké.`);
  document.getElementById('filters').outerHTML = `<a class="btn" href="${TU.mailFor(sel, shown)}" data-book="${sel.ids.join(',')}" >${T('Parlons du projet', "Let's talk about the project")}</a>`;
}

// Nav reprise de DAKĒ STUDIO
renderShell({
  root: '../../', home: sel ? './?' + sel.qs : './',
  sections: sel ? [['#list', 'Casting'], ['#contact', 'Contact']] : [['#list', 'Talents'], ['#contact', 'Contact']],
  book: sel ? { label: T('Parlons du projet', "Let's talk"), href: TU.mailFor(sel, shown), ids: sel.ids.join(',') } : { label: T('Proposer un projet', 'Start a project'), href: 'mailto:' + ECO.mail, ids: '' },
  dock: sel ? `Casting <strong>${esc(sel.client || T('privée', 'private'))}</strong>` : `<strong>${shown.length}</strong> talents`
});

// Footer
renderFooter(document.getElementById('contact'), sel
  ? { root: '../../', folio: 'Casting ' + esc(sel.client || T('privé', 'private')), title: T('Ce casting <em>vous parle ?</em>', 'Does this casting <em>speak to you?</em>'), actions: [{ label: T('Construisons la production', "Let's build the production"), href: TU.mailFor(sel, shown), book: sel.ids.join(',') }] }
  : { root: '../../' });
initReveal();

// Filtres : les lignes sortent et rentrent en douceur
const cats = [['all', T('Tous', 'All')], ['mannequin', T('Mannequins', 'Models')], ['comedien', T('Comédiens', 'Actors')], ['influence', 'Influence']];
const fBox = document.getElementById('filters');
if (fBox) fBox.innerHTML = cats.map(([k, l], i) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${i === 0}">${l}<sup>${k === 'all' ? TALENTS.length : TALENTS.filter(t => t.cats.includes(k)).length}</sup></button>`).join('');
fBox?.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b || b.getAttribute('aria-pressed') === 'true') return;
  fBox.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  list.classList.add('is-filtering');
  setTimeout(() => {
    let n = 0;
    list.querySelectorAll('.v1-row').forEach(r => {
      const show = b.dataset.f === 'all' || r.dataset.cats.includes(b.dataset.f);
      r.classList.toggle('is-hidden', !show); if (show) r.style.setProperty('--d', n++);
    });
    document.getElementById('count').textContent = pad(n);
    const ds = document.querySelector('.dock span'); if (ds) ds.innerHTML = `<strong>${n}</strong> ${n > 1 ? 'talents' : 'talent'}`;
    requestAnimationFrame(() => list.classList.remove('is-filtering'));
  }, 260);
});

// Photo qui suit le curseur (desktop) : GPU, et la boucle ne tourne que pendant le survol
const cur = document.getElementById('cursor'), cimg = cur.querySelector('img');
let x = 0, y = 0, cx = 0, cy = 0, running = false;
function loop() {
  cx += (x - cx) * .16; cy += (y - cy) * .16;
  cur.style.transform = `translate3d(${cx}px, ${cy}px, 0) translate(-50%, -50%)`;
  if (running) requestAnimationFrame(loop);
}
addEventListener('mousemove', e => { x = e.clientX; y = e.clientY; }, { passive: true });
list.addEventListener('mouseenter', e => { cx = x = e.clientX; cy = y = e.clientY; if (!running) { running = true; requestAnimationFrame(loop); } });
list.addEventListener('mouseover', e => { const a = e.target.closest('a'); if (!a) return; if (cimg.getAttribute('src') !== a.dataset.img) cimg.src = a.dataset.img; cur.classList.add('on'); });
list.addEventListener('mouseleave', () => { cur.classList.remove('on'); setTimeout(() => { if (!cur.classList.contains('on')) running = false; }, 400); });
// Couvertures préchargées : le survol est instantané
(window.requestIdleCallback || setTimeout)(() => shown.forEach(t => { const i = new Image(); i.src = TU.src(t.cover); }));
</script>
</body>
</html>

<!doctype html>
<html lang="fr" class="theme-white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FACE BY DAKĒ © — Talent</title>
<meta name="robots" content="noindex, nofollow"> <!-- SEO-LANCEMENT : à retirer au lancement (voir SEO.md) -->
<link rel="icon" href="../icon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

document.documentElement.classList.add('js');
// Rien ne s'affiche avant les polices : pas de saut de typo (même principe que FACE)
(function(){var d=document.documentElement,done=function(){d.classList.add('fonts-ready')};
if(document.fonts&&document.fonts.load){Promise.race([Promise.all([document.fonts.load('italic 300 80px Newsreader'),document.fonts.load('300 80px Newsreader'),document.fonts.load('500 16px "Instrument Sans"')]),new Promise(function(r){setTimeout(r,1800)})]).then(done,done)}else done();})();
</script>
</head>
<body>
<main id="app"></main>
<footer id="contact"></footer>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script src="../i18n.js"></script>
<script src="../talents-data.js"></script>
<script src="../data.js"></script>
<script src="../ui.js"></script>
<script src="../premium.js"></script>
<script src="../booking.js"></script>
<script src="../composite.js"></script>
<script>
const P = '../';
const t = TU.get(new URLSearchParams(location.search).get('t'));
// En mode sélection, on reste dans les profils choisis pour le prospect
const sel = TU.selection();
const pool = sel && sel.talents.includes(t) ? sel.talents : TALENTS;
const i = pool.indexOf(t), next = pool[(i + 1) % pool.length];
const keep = sel ? '&' + sel.qs : '';
const f = t.fiche || {}, s = TU.show(t, 'stats') ? t.social : null;
const full = `${t.first} ${t.last}`;
// SEO : une page par talent (titre, description, fiche Person pour Google)
const catTxt = (t.cats || []).map(c => CAT_LABEL[c]).join(', ');
TU.seo({
  path: 'talent.html', params: { t: t.slug }, type: 'profile',
  noindex: t.visible === false || !t.consent || new URLSearchParams(location.search).get('t') !== t.slug,
  title: `${full} — ${catTxt} · FACE BY DAKĒ ©`,
  description: [T(`${full}, ${catTxt.toLowerCase()} basé·e à ${TR(t.city) || 'Paris'}.`, `${full}, ${catTxt.toLowerCase()} based in ${TR(t.city) || 'Paris'}.`),
    f.taille ? T(`Taille ${f.taille} cm.`, `Height ${f.taille} cm.`) : '', TX(t, 'bio'), T('Polas, book et booking sur FACE BY DAKĒ.', 'Polas, book and booking on FACE BY DAKĒ.')].filter(Boolean).join(' ').slice(0, 300),
  image: TU.abs(t.cover),
  ld: { '@graph': [FACE_ORG, { '@type': 'ProfilePage', url: SITE_URL + '/talents/v1/talent.html?t=' + t.slug, inLanguage: EN ? 'en-GB' : 'fr-FR',
    mainEntity: { '@type': 'Person', name: full, givenName: t.first, familyName: t.last, jobTitle: catTxt, image: TU.abs(t.cover),
      height: f.taille ? { '@type': 'QuantitativeValue', value: +f.taille, unitCode: 'CMT' } : undefined,
      knowsLanguage: t.languages || undefined, homeLocation: t.city ? { '@type': 'Place', name: t.city } : undefined,
      affiliation: { '@id': FACE_ORG['@id'] } } }] }
});
const mail = TU.mailFor(sel, [t]);
const pad = n => String(n).padStart(2, '0');

// Blocs affichés : ceux qui ont du contenu et ne sont pas désactivés dans le back office
const LABELS = { polas: 'Polas', book: 'Book', video: (t.videos || []).length > 1 ? T('Vidéos', 'Videos') : T('Vidéo', 'Video'), stats: 'Stats & engagement' };
// Une vidéo : fichier hébergé ou lien de plateforme (YouTube / Vimeo intégrés, autre site = lien externe)
const PLAY_IC = '<svg class="play-ic" viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0L10 6L0 12Z"/></svg>';
function videoBlock(v) {
  const e = v.url ? TU.embed(v.url) : null, title = TX(v, 'title'), poster = v.poster ? TU.src(v.poster) : e && e.thumb;
  const meta = `<div class="player-meta caps"><span>${esc(title)}</span><span class="dim">${esc(TX(v, 'credit', e ? e.name : 'Réalisée par Daké'))}</span></div>`;
  if (e && e.kind === 'link') return `<figure class="v1-video reveal"><a class="player player--link" href="${esc(v.url)}" target="_blank" rel="noopener">${poster ? `<img src="${esc(poster)}" alt="" loading="lazy">` : ''}<span class="play caps"><span>${PLAY_IC}${T('Voir sur', 'Watch on')} ${esc(e.name)} ↗</span></span></a>${meta}</figure>`;
  return `<figure class="v1-video reveal"><div class="player"${e ? ` data-embed="${esc(e.embed)}" data-title="${esc(title)}"` : ''}>
      ${e ? (poster ? `<img src="${esc(poster)}" alt="" loading="lazy">` : '') : `<video src="${TU.src(v.src)}" poster="${TU.src(v.poster)}" playsinline preload="none"></video>`}
      <button class="play caps" type="button"><span>${PLAY_IC}${T('Lire', 'Play')}${v.len ? ' · ' + esc(v.len) : ''}</span></button>
    </div>${meta}</figure>`;
}
const ORDER = ['polas', ...(t.order || ['book', 'video', 'stats']).filter(k => k !== 'polas' && LABELS[k]), ...['book', 'video', 'stats'].filter(k => !(t.order || []).includes(k))]
  .filter((k, i, a) => a.indexOf(k) === i);
const blocks = ORDER.map(k => [k, LABELS[k]]).filter(b => TU.show(t, b[0]));
const has = k => blocks.some(b => b[0] === k);
// Une fiche affichée seulement en aperçu (masquée ou sans accord) le signale
const draftNote = (t.visible === false || !t.consent) ? `<p class="draft-note mono">${!t.consent ? T('Brouillon · accord droit à l\'image manquant', 'Draft · image release missing') : T('Brouillon', 'Draft')} · ${T('visible uniquement en aperçu', 'preview only')}</p>` : '';
const row = (k, v) => v || v === 0 ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
// Mensurations : cm / EU ou pouces / US, au choix du visiteur (gardé dans son navigateur)
const hasSizes = ['taille', 'poitrine', 'tailleT', 'hanches', 'pointure'].some(k => f[k]);
const UNIT_BTNS = [['metric', 'cm · EU'], ['us', 'in · US']].map(([u, l]) => `<button type="button" data-units="${u}" aria-pressed="${UNITS === u}">${l}</button>`).join('');
function ficheRows() {
  return [
    [T('Taille', 'Height'), SIZE.height(f.taille)],
    [T('Poitrine', 'Bust'), SIZE.body(f.poitrine)],
    [T('Tour de taille', 'Waist'), SIZE.body(f.tailleT)],
    [T('Hanches', 'Hips'), SIZE.body(f.hanches)],
    [T('Pointure', 'Shoe'), SIZE.shoe(f.pointure, f.genre)],
    [T('Yeux', 'Eyes'), TR(f.yeux)],
    [T('Cheveux', 'Hair'), TR(f.cheveux)]
  ];
}
const fiche = () => ficheRows().map(([k, v]) => row(k, v)).join('')
  + row(T('Langues', 'Languages'), TR(t.languages))
  + ((t.specs || []).length ? row(T('Spécialités', 'Specialties'), t.specs.map(TR).join(', ')) : '')
  + row(T('Basé·e à', 'Based in'), TR(t.city))
  + row(T('Agence', 'Agency'), t.agency);
const folio = (k, label) => `<div class="folio caps"><span>${esc(full)}</span><span>${label}</span><span>${pad(blocks.findIndex(b => b[0] === k) + 1)} / ${pad(blocks.length)}</span></div>`;

// Sections de la fiche : les polas d'abord, puis l'ordre choisi dans le back office
const SEC = {
  polas: () => has('polas') ? `<section class="section is-soft" id="polas">
    ${folio('polas', 'Polas / Digitals')}
    <div class="v1-block-head"><h2 class="h2">${TU.title(TX(t, 'polasTitle', 'Au *naturel.*'))}</h2><p class="caps dim">${esc(TX(t, 'polasNote', 'Pris au studio Daké'))}</p></div>
    <div class="v1-polas reveal" id="polas-track" tabindex="0" aria-label="${T('Polas, faire défiler', 'Polas, scroll')}">${[0, 1, 2].map(c => t.polas.map((p, n) => `<figure class="pola" data-n="${n}"${c !== 1 ? ' aria-hidden="true"' : ''}><div class="media"><img src="${TU.src(p[0])}" alt="${c === 1 ? 'Pola ' + esc(TR(p[1])) : ''}" draggable="false"></div><figcaption class="mono"><span>${esc(TR(p[1]))}</span><span class="dim">${pad(n + 1)} / ${pad(t.polas.length)}</span></figcaption></figure>`).join('')).join('')}</div>
    <div class="pola-ctrl"><span class="mono dim" id="polas-n">01 / ${pad(t.polas.length)}</span><span class="prog"><i id="polas-bar"></i></span><button type="button" data-d="-1" aria-label="${T('Pola précédent', 'Previous pola')}">←</button><button type="button" data-d="1" aria-label="${T('Pola suivant', 'Next pola')}">→</button></div>
  </section>` : '',

  book: () => has('book') ? `<section class="section" id="book">
    ${folio('book', 'Book')}
    <div class="v1-book">${t.book.map((b, n) => `<figure class="media reveal" data-n="${n}" role="button" tabindex="0" aria-label="${T('Agrandir la photo', 'Enlarge photo')} ${n + 1}"><img src="${TU.src(b)}" alt="" loading="lazy"></figure>`).join('')}</div>
  </section>` : '',

  video: () => has('video') ? `<section class="section ${s ? 'is-paper' : 'is-dark'}" id="video"${s ? '' : ' data-tone="dark"'}>
    ${folio('video', LABELS.video)}
    <div class="v1-videos${t.videos.length > 1 ? ' is-multi' : ''}">${t.videos.map(videoBlock).join('')}</div>
  </section>` : '',

  stats: () => s ? `<section class="section is-dark" id="stats" data-tone="dark">
    ${folio('stats', 'Stats & engagement')}
    <div class="v1-block-head"><h2 class="h2">${T('L\'audience, <em>en chiffres.</em>', 'The audience, <em>in numbers.</em>')}</h2><p class="caps dim">Instagram · TikTok</p></div>
    ${renderStats(s)}
  </section>` : ''
};

document.getElementById('app').innerHTML = `
  <section class="v1-profile">
    ${draftNote}
    <h1 class="v1-name"><span class="rise"><span>${esc(t.first)}</span></span><span class="rise"><span><em>${esc(t.last)}</em></span></span></h1>
    <div class="grid v1-profile-body">
      <figure class="media v1-cover reveal"><img src="${TU.src(t.cover)}" alt="${T('Portrait de', 'Portrait of')} ${esc(full)}" fetchpriority="high"></figure>
      <div class="v1-info reveal">
        <div class="tags caps">${(t.cats || []).map(c => `<span>${CAT_LABEL[c]}</span>`).concat((t.specs || []).map(x => `<span>${esc(TR(x))}</span>`)).join('')}${t.availability && t.availability !== 'disponible' ? `<span class="avail avail--${t.availability}">${AVAIL_LABEL[t.availability]}</span>` : ''}</div>
        ${hasSizes ? `<div class="units caps" role="group" aria-label="${T('Unités des mensurations', 'Measurement units')}">${UNIT_BTNS}</div>` : ''}
        <dl class="fiche" id="fiche">${fiche()}</dl>
        ${t.bio ? `<p class="v1-bio">${esc(TX(t, 'bio'))}</p>` : ''}
        ${s ? `<div class="v1-social mono"><a href="#stats">IG ${TU.k(s.ig.followers)}</a><a href="#stats">TT ${TU.k(s.tt.followers)}</a><span class="dim">ER ${TU.pct(TU.erAvg(s))}</span></div>` : ''}
        <div class="actions"><a class="btn" href="${mail}" data-book="${t.slug}" data-kind="option">${T('Demander une option', 'Request a hold')}</a><button class="btn btn--ghost" type="button" id="composite-btn">${T('Carte composite (PDF)', 'Comp card (PDF)')}</button></div>
      </div>
    </div>
  </section>

  <nav class="subnav caps" aria-label="${T('Sur cette fiche', 'On this profile')}">${blocks.map((b, n) => `<a href="#${b[0]}"><sup>${pad(n + 1)}</sup>${b[0] === 'stats' ? 'Stats' : b[1]}</a>`).join('')}</nav>

  ${ORDER.map(k => SEC[k]()).join('')}

  <a class="v1-next" href="talent.html?t=${next.slug}${keep}" data-img="${TU.src(next.cover)}">
    <span class="caps dim">${sel ? T('Profil suivant de la sélection', 'Next profile in the selection') : T('Talent suivant', 'Next talent') + ' · ' + next.code}</span>
    <p class="serif">${esc(next.first)} <em>${esc(next.last)}</em> ${ARROW}</p>
  </a>`;

// Carte composite : une page A4 paysage, à enregistrer en PDF depuis la fenêtre d'impression.
// Des cadrages variés comme une carte d'agence : pied, profil, 3/4, assise, puis une image du book. Jamais la couverture en double.
function compositeImgs(t) {
  if (t.composite) return t.composite.slice(0, 4);
  const pool = t.polas.filter(p => p[0] !== t.cover), pick = [];
  ['pied', 'profil', '3/4', 'assise', 'pose'].forEach(k => {
    const p = pool.find(x => x[1].toLowerCase().includes(k) && !pick.includes(x[0]));
    if (p && pick.length < 3) pick.push(p[0]);
  });
  const b = t.book.find(x => x !== t.cover && !pick.includes(x)); if (b) pick.push(b);
  pool.forEach(p => { if (pick.length < 4 && !pick.includes(p[0])) pick.push(p[0]); });
  return pick.slice(0, 4);
}
const comp = document.createElement('section');
comp.className = 'composite'; comp.setAttribute('aria-hidden', 'true');
comp.innerHTML = `
  <header class="cc-head">
    <h1 class="cc-name">${esc(t.first)} <em>${esc(t.last)}</em></h1>
    <p class="cc-cats">${TU.cats(t)}<span>${esc(TR(t.city))}</span></p>
  </header>
  <div class="cc-body">
    <div class="cc-main"><img src="${TU.src(t.cover)}" alt=""></div>
    <div class="cc-grid">${compositeImgs(t).map(src => `<div><img src="${TU.src(src)}" alt=""></div>`).join('')}</div>
    <aside class="cc-side">
      <dl class="cc-fiche" id="cc-fiche"></dl>
      <p class="cc-brand">FACE BY DAKĒ<span>©</span></p>
    </aside>
  </div>
  <footer class="cc-foot"><span>${ECO.mail}</span><span>${T('Carte composite', 'Comp card')}</span><span>${t.code}</span></footer>`;
document.body.appendChild(comp);
// Ordinateur : PDF via l'impression. Téléphone : image JPG à enregistrer ou partager.
const isMobile = matchMedia('(max-width: 860px), (pointer: coarse)').matches;
const compBtn = document.getElementById('composite-btn');
if (isMobile) compBtn.textContent = T('Carte composite (image)', 'Comp card (image)');
// Aperçu plein écran de la carte (téléphone) avant de l'enregistrer ou de la partager
function previewComposite(blob, name) {
  const url = URL.createObjectURL(blob), box = document.createElement('div');
  box.className = 'cc-preview'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', T('Aperçu de la carte composite', 'Comp card preview'));
  box.innerHTML = `<div class="cc-preview-top caps"><span>${T('Carte composite', 'Comp card')}</span><button type="button" data-x>${T('Fermer', 'Close')}</button></div>
    <div class="cc-preview-img" data-lenis-prevent><img src="${url}" alt="${esc(full)} — ${T('carte composite', 'comp card')}"></div>
    <div class="cc-preview-foot"><button class="btn" type="button" data-share>${navigator.canShare ? T('Enregistrer ou partager', 'Save or share') : T('Télécharger', 'Download')}</button></div>`;
  document.body.appendChild(box);
  window.lockScroll?.(true);
  requestAnimationFrame(() => box.classList.add('on'));
  const close = () => { box.classList.remove('on'); window.lockScroll?.(false); setTimeout(() => { box.remove(); URL.revokeObjectURL(url); }, 450); };
  box.querySelector('[data-x]').addEventListener('click', close);
  box.querySelector('[data-share]').addEventListener('click', async () => { if (await shareComposite(blob, name) !== 'cancelled') close(); });
  box.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  box.querySelector('[data-x]').focus({ preventScroll: true });
}
compBtn.addEventListener('click', async () => {
  if (isMobile) {
    const label = compBtn.textContent; compBtn.textContent = T('Préparation…', 'Preparing…'); compBtn.disabled = true;
    try {
      const blob = await compositeJPG(t, [t.cover, ...compositeImgs(t)].map(x => TU.src(x)));
      const slug = (t.first + '-' + t.last).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '-');
      previewComposite(blob, `${slug}-${T('carte-composite', 'comp-card')}-dake.jpg`);
    } finally { compBtn.textContent = label; compBtn.disabled = false; }
    return;
  }
  const imgs = [...comp.querySelectorAll('img')];
  Promise.all(imgs.map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; }))).then(() => {
    const old = document.title; document.title = `${full} — ${T('Carte composite', 'Comp card')} Daké`;
    print(); setTimeout(() => { document.title = old; }, 500);
  });
});

// Fiche de la carte composite : mêmes unités que la page
const ccFiche = () => {
  document.getElementById('cc-fiche').innerHTML = ficheRows().filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')
    + ((t.specs || []).length ? `<dt>${T('Spécialités', 'Specialties')}</dt><dd>${t.specs.map(x => esc(TR(x))).join(', ')}</dd>` : '')
    + (s ? `<dt>Instagram</dt><dd>${esc(s.ig.handle)} · ${TU.k(s.ig.followers)}</dd><dt>TikTok</dt><dd>${esc(s.tt.handle)} · ${TU.k(s.tt.followers)}</dd>` : '');
};
ccFiche();
document.querySelector('.units')?.addEventListener('click', e => {
  const b = e.target.closest('[data-units]'); if (!b || b.dataset.units === UNITS) return;
  setUnits(b.dataset.units);
});
document.addEventListener('units', () => {
  document.querySelectorAll('.units [data-units]').forEach(b => b.setAttribute('aria-pressed', b.dataset.units === UNITS));
  document.getElementById('fiche').innerHTML = fiche();
  ccFiche();
});

renderFooter(document.getElementById('contact'), {
  root: '../../',
  folio: sel ? T('Sélection ', 'Selection ') + esc(sel.client || T('privée', 'private')) : 'Booking',
  actions: [{ label: T('Booker ', 'Book ') + esc(t.first), href: mail, book: t.slug }, { label: sel ? T('Revoir la sélection', 'Back to the selection') : T('Tous les talents', 'All talents'), href: sel ? './?' + sel.qs : './', ghost: true }]
});
initPlayer(document);
initReveal();
renderShell({
  root: '../../', home: sel ? './?' + sel.qs : './',
  // Même nav que la home : les ancres du profil sont dans la barre sous la photo
  sections: sel ? [['./?' + sel.qs, T('Sélection', 'Selection')], ['#contact', 'Booking']] : [['./', 'Talents'], ['#contact', 'Booking']],
  book: { label: T('Booker ', 'Book ') + t.first, href: mail, ids: t.slug },
  dock: `${esc(t.first)} <strong>${esc(t.last)}</strong>`
});

initSpy(document.querySelectorAll('.subnav a'));

// Visionneuse : clic sur une photo du book
const bookItems = t.book.map((b, n) => [TU.src(b), pad(n + 1)]);
const bookEl = document.querySelector('.v1-book');
bookEl?.addEventListener('click', e => { const m = e.target.closest('.media'); if (m) openViewer(bookItems, +m.dataset.n, full + ' · Book'); });
bookEl?.addEventListener('keydown', e => { const m = e.target.closest('.media'); if (m && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openViewer(bookItems, +m.dataset.n, full + ' · Book'); } });

// Polas en boucle infinie : la série est posée 3 fois, on reste toujours sur la copie du milieu.
// Swipe tactile natif, glisser à la souris, flèches, clavier ; un clic sans glisser ouvre la visionneuse.
(function () {
  const tr = document.getElementById('polas-track'); if (!tr) return;
  const items = tr.querySelectorAll('.pola');
  const n = t.polas.length;
  const bar = document.getElementById('polas-bar'), num = document.getElementById('polas-n');
  const [prev, nextB] = document.querySelectorAll('.pola-ctrl button');
  prev.disabled = nextB.disabled = false;
  const step = () => items[1].offsetLeft - items[0].offsetLeft;
  const setW = () => items[n].offsetLeft - items[0].offsetLeft;
  // Saut invisible d'une série entière (snap coupé le temps du saut)
  function jump(dx) {
    tr.style.scrollSnapType = 'none';
    tr.scrollLeft += dx;
    void tr.offsetWidth;
    tr.style.scrollSnapType = '';
  }
  function recenter() {
    const W = setW();
    if (tr.scrollLeft < W - step() / 2) jump(W);
    else if (tr.scrollLeft >= 2 * W - step() / 2) jump(-W);
  }
  function sync() {
    let pos = tr.scrollLeft / step();
    if (Math.abs(pos - Math.round(pos)) < 0.03) pos = Math.round(pos); // arrondi du snap : 7,99 = 8
    const k = ((Math.round(pos) % n) + n) % n;
    num.textContent = pad(k + 1) + ' / ' + pad(n);
    const frac = (((pos % n) + n) % n) / n;
    const left = frac * 100, last = parseFloat(bar.style.left) || 0;
    // Passage 08 → 01 (ou l'inverse) : la barre revient d'un coup au lieu de traverser
    bar.style.transition = Math.abs(left - last) > 50 ? 'none' : '';
    bar.style.width = (100 / n) + '%';
    bar.style.left = left + '%';
  }
  // Recentrage dès que le défilement s'arrête
  let idle = 0;
  const settle = () => { if (!down) { recenter(); sync(); } };
  if ('onscrollend' in window) tr.addEventListener('scrollend', settle);
  tr.addEventListener('scroll', () => { requestAnimationFrame(sync); clearTimeout(idle); idle = setTimeout(settle, 140); }, { passive: true });

  const go = d => { recenter(); tr.scrollBy({ left: d * step(), behavior: 'smooth' }); };
  [prev, nextB].forEach(b => b.addEventListener('click', () => go(+b.dataset.d)));
  tr.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); go(e.key === 'ArrowRight' ? 1 : -1); } });

  let down = false, moved = 0, sx = 0, sl = 0;
  tr.addEventListener('pointerdown', e => { moved = 0; if (e.pointerType !== 'mouse') return; down = true; sx = e.clientX; sl = tr.scrollLeft; tr.classList.add('is-drag'); });
  tr.addEventListener('pointermove', e => {
    if (!down) return;
    moved = Math.max(moved, Math.abs(e.clientX - sx));
    tr.scrollLeft = sl - (e.clientX - sx);
    // Bord atteint pendant le glisser : on saute d'une série et on continue
    const W = setW();
    if (tr.scrollLeft < W / 2) { jump(W); sl += W; } else if (tr.scrollLeft > 2.5 * W - tr.clientWidth) { jump(-W); sl -= W; }
  });
  addEventListener('pointerup', () => {
    if (!down) return; down = false;
    tr.classList.remove('is-drag');
    tr.scrollTo({ left: Math.round(tr.scrollLeft / step()) * step(), behavior: 'smooth' });
  });

  const polaItems = t.polas.map(p => [TU.src(p[0]), TR(p[1])]);
  tr.addEventListener('click', e => { const p = e.target.closest('.pola'); if (p && moved < 6) openViewer(polaItems, +p.dataset.n, full + ' · Polas'); });

  // Départ sur la copie du milieu, premier pola
  const start = () => { tr.style.scrollSnapType = 'none'; tr.scrollLeft = setW(); void tr.offsetWidth; tr.style.scrollSnapType = ''; sync(); };
  start();
  addEventListener('resize', () => { const k = Math.round(tr.scrollLeft / step()) % n; tr.style.scrollSnapType = 'none'; tr.scrollLeft = setW() + k * step(); tr.style.scrollSnapType = ''; sync(); });
  if (document.fonts) document.fonts.ready.then(start);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="fr" class="theme-white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Back office — FACE BY DAKĒ ©</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<!-- Installable sur l'écran d'accueil (iPhone : Partager → Sur l'écran d'accueil) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Face">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-48.png" sizes="48x48">
<script src="../gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <a class="logo" href="../v1/" target="_blank" rel="noopener">FACE BY DAKĒ<span>©</span> <em>Back office</em></a>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-view="talents" aria-current="page">Talents</button>
      <button type="button" data-view="prospection">Prospection</button>
      <button type="button" data-view="settings">Réglages</button>
    </nav>
    <div class="top-actions">
      <span class="status" id="status" aria-live="polite"></span>
      <button class="btn btn--ghost btn--s" type="button" id="discard" hidden>Annuler les modifications</button>
      <button class="btn btn--s" type="button" id="publish">Publier</button>
    </div>
  </header>
  <main class="views" id="views"></main>
  <!-- Téléphone : onglets en bas, comme une app -->
  <nav class="tabs tabbar" aria-label="Sections">
    <button type="button" data-view="talents" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.8 3.8-6 7.5-6s6.7 2.2 7.5 6"/></svg><span>Talents</span></button>
    <button type="button" data-view="prospection"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v11H4z"/><path d="M4 7l8 6 8-6"/></svg><span>Prospection</span></button>
    <button type="button" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span>Réglages</span></button>
  </nav>
</div>

<dialog class="modal" id="modal"><form method="dialog" class="modal-box" id="modal-box"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../i18n.js"></script>
<script src="../talents-data.js"></script>
<script src="../sitemap.js"></script>
<script src="admin.js"></script>
<script src="motion.js"></script>
</body>
</html>
